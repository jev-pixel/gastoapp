name: gastoapp
description: "A Budget App for managing your expenses and income"
publish_to: 'JevGames'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: 9.2.4
  provider: ^6.1.5+1
  intl: ^0.20.3
  google_fonts: ^8.2.1

  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1


flutter:
  uses-material-design: true
  

  assets:
    - assets/icon/icon.png
    - assets/icon/icon_foreground.png

# ---------------------------------------------------------------------------
# App icon config — run `dart run flutter_launcher_icons` after editing.
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0F5132"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"